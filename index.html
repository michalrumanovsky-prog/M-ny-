<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Míny Pro</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            --block-top: #475569;
            --block-bottom: #334155;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --success: #4ade80;
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            font-family: 'Quicksand', sans-serif; margin: 0; padding: 0;
            height: 100vh; width: 100vw; overflow: hidden;
            background: var(--bg-gradient); color: var(--text);
            display: flex; justify-content: center; align-items: center;
        }

        #fx-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

        /* SCREENS */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; transition: opacity 0.4s, transform 0.4s;
            opacity: 0; pointer-events: none; z-index: 10;
        }
        .screen.active { opacity: 1; pointer-events: all; transform: scale(1); }
        .screen.hidden { transform: scale(1.1); opacity: 0; }

        /* MENU */
        h1.logo {
            font-size: 4.5rem; font-weight: 900; margin-bottom: 40px; letter-spacing: 2px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .menu-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; width: 100%; max-width: 320px; padding: 20px; margin: 8px 0;
            border-radius: 20px; font-size: 1.2rem; font-weight: 700; cursor: pointer;
            transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); backdrop-filter: blur(10px);
        }
        .menu-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
        .menu-btn.primary { background: var(--primary); color: #0f172a; border: none; box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); }

        #difficulty-selector { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; width: 100%; max-width: 320px; }
        #difficulty-selector.open { max-height: 350px; }
        .diff-btn { width: 100%; padding: 12px; margin: 4px 0; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--primary); color: var(--primary); border-radius: 15px; font-weight: bold; cursor: pointer; }

        /* GAME UI */
        .game-header {
            width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); 
            padding: 15px 30px; border-radius: 25px; margin-bottom: 25px; 
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }

        .grid-wrapper { padding: 0; position: relative; }
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; position: relative; z-index: 5; }

        /* KOCKY - TACTILE DESIGN */
        .cell {
            width: 38px; height: 38px; 
            background: linear-gradient(145deg, var(--block-top), var(--block-bottom));
            border-radius: 10px; border: none;
            display: flex; justify-content: center; align-items: center; 
            font-weight: 900; font-size: 20px; 
            cursor: pointer; position: relative; transition: all 0.1s ease-out;
            box-shadow: inset 1px 1px 1px rgba(255,255,255,0.15), 0 4px 6px rgba(0,0,0,0.3);
        }
        @media (max-height: 800px) { .cell { width: 34px; height: 34px; font-size: 18px; border-radius: 8px; } }
        @media (max-height: 700px) { .cell { width: 30px; height: 30px; font-size: 16px; border-radius: 6px; } }

        .cell:active { transform: scale(0.95); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

        /* ODKRYTÁ KOCKA - KRÁTER */
        .cell.checked { 
            background: rgba(0,0,0,0.2); 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); /* Vnútorný tieň krátera */
            cursor: default; transform: none; border-radius: 8px;
        }
        
        .cell.bomb { 
            background: var(--accent); box-shadow: 0 0 20px var(--accent); 
            border-radius: 50%; z-index: 2; border: 2px solid white; transform: scale(0.9);
        }
        .cell.flag { background: #fff; color: var(--accent); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .cell.long-press-active { transform: scale(0.9); background: var(--accent); transition: 0.3s; }

        .one { color: #60a5fa; text-shadow: 0 0 15px rgba(96, 165, 250, 0.5); } 
        .two { color: #4ade80; text-shadow: 0 0 15px rgba(74, 222, 128, 0.5); } 
        .three { color: #f43f5e; text-shadow: 0 0 15px rgba(244, 63, 94, 0.5); } 
        .four { color: #facc15; } .five { color: #c084fc; }

        .game-footer { margin-top: 30px; width: 100%; max-width: 450px; display: flex; justify-content: center; gap: 15px; }
        .btn-circle { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 1.4rem; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .btn-circle:active { transform: scale(0.9); }
        .mode-toggle { flex-grow: 1; border-radius: 30px; font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; border: none; background: var(--primary); color: #0f172a; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; }
        .mode-toggle:active { transform: scale(0.97); }
        .mode-toggle.flag-mode { background: var(--accent); color: white; box-shadow: 0 4px 20px rgba(244, 63, 94, 0.3); }

        /* MODALY */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: 100; display: none; justify-content: center; align-items: center; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay.peeking { background: rgba(0,0,0,0.1); backdrop-filter: blur(0px); }
        .modal-overlay.peeking .modal-box { opacity: 0; transform: scale(0.9); pointer-events: none; }
        
        .modal-box { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 25px; width: 90%; max-width: 360px; text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,0.6); transition: transform 0.2s, opacity 0.2s; }

        .slider-container { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .range-slider { -webkit-appearance: none; width: 100%; height: 6px; background: #334155; border-radius: 5px; outline: none; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        
        .tab-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .tab-btn { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 8px 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: #0f172a; border-color: var(--primary); }
        
        .modal-input { width: 100%; padding: 16px; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.1); border-radius: 15px; color: white; text-align: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; }
        .btn-full { width: 100%; padding: 16px; border-radius: 15px; font-weight: 700; border: none; cursor: pointer; font-size: 1rem; margin-bottom: 12px; transition: 0.2s; letter-spacing: 0.5px; }
        .btn-full:active { transform: scale(0.97); }
        .btn-green { background: var(--success); color: #064e3b; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn-grey { background: rgba(255,255,255,0.08); color: white; }
        
        .hint-text { font-size: 0.8rem; opacity: 0.5; margin-top: 15px; color: #94a3b8; pointer-events: none; }
        #fireworks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <div id="screen-menu" class="screen active">
        <h1 class="logo">MÍNY</h1>
        <button class="menu-btn primary" onclick="toggleDifficulty()"><span>▶ NOVÁ HRA</span></button>
        <div id="difficulty-selector">
            <button class="diff-btn" onclick="startNewGame(10)">10 MÍN (Ľahká)</button>
            <button class="diff-btn" onclick="startNewGame(15)">15 MÍN (Stredná)</button>
            <button class="diff-btn" onclick="startNewGame(20)">20 MÍN (Ťažká)</button>
            <button class="diff-btn" onclick="startNewGame(25)">25 MÍN (Expert)</button>
        </div>
        <button class="menu-btn" onclick="openLeaderboard()"><span>🏆 TABUĽKA</span></button>
        <button class="menu-btn" onclick="openSettings()"><span>⚙ NASTAVENIA</span></button>
    </div>

    <div id="screen-game" class="screen">
        <div class="game-header">
            <div class="stat-box"><div class="stat-label">Míny</div><div class="stat-value" id="ui-mines">0</div></div>
            <div class="stat-box"><div class="stat-label">Čas</div><div class="stat-value" id="ui-timer">00:00</div></div>
        </div>
        <div class="grid-wrapper" id="grid-container"><div class="grid" id="grid"></div></div>
        <div class="game-footer">
            <button class="btn-circle" onclick="confirmExit()">☰</button>
            <button id="mode-btn" class="mode-toggle" onclick="toggleMode()">⛏️ KOPAŤ</button>
        </div>
    </div>

    <div id="modal-settings" class="modal-overlay">
        <div class="modal-box">
            <h2>NASTAVENIA</h2>
            <div class="slider-container"><span>🎵</span><input type="range" min="0" max="100" value="50" class="range-slider" id="music-volume" oninput="updateVolumes()"></div>
            <div class="slider-container"><span>🔊</span><input type="range" min="0" max="100" value="70" class="range-slider" id="sfx-volume" oninput="updateVolumes()"></div>
            <br>
            <button class="btn-full btn-grey" onclick="closeModal('modal-settings')">Zavrieť</button>
        </div>
    </div>
    
    <div id="modal-leaderboard" class="modal-overlay">
        <div class="modal-box">
            <h2>REBRÍČEK</h2>
            <div class="tab-nav">
                <button class="tab-btn" onclick="renderLeaderboard(10)" id="tab-10">10</button>
                <button class="tab-btn" onclick="renderLeaderboard(15)" id="tab-15">15</button>
                <button class="tab-btn" onclick="renderLeaderboard(20)" id="tab-20">20</button>
                <button class="tab-btn" onclick="renderLeaderboard(25)" id="tab-25">25</button>
            </div>
            <div id="leaderboard-content" style="max-height: 200px; overflow-y: auto;"></div>
            <br>
            <button class="btn-full btn-grey" onclick="closeModal('modal-leaderboard')">Zavrieť</button>
        </div>
    </div>

    <div id="modal-gameover" class="modal-overlay">
        <div class="modal-box">
            <h2 id="go-title">KONIEC</h2>
            <p id="go-msg" style="margin-bottom:20px; color:#ccc; font-size:1.1rem;"></p>
            <div id="win-controls" style="display:none;">
                <input type="text" id="player-name" class="modal-input" placeholder="Zadaj svoje meno" maxlength="12">
                <button class="btn-full btn-green" onclick="handleWinAction('restart')">💾 ULOŽIŤ A NOVÁ HRA</button>
                <button class="btn-full btn-grey" onclick="handleWinAction('menu')">🏠 ULOŽIŤ A MENU</button>
            </div>
            <div id="loss-controls" style="display:none;">
                <button class="btn-full btn-green" onclick="restartGame()">↻ HRAŤ ZNOVA</button>
                <button class="btn-full btn-grey" onclick="goToMenu()">🏠 MENU</button>
            </div>
            <p class="hint-text">(Podrž prst mimo pre náhľad)</p>
        </div>
    </div>

    <script>
        const CONFIG = { width: 10, height: 14, longPressTime: 400 };
        let STATE = { screen: 'menu', minesTotal: 10, minesLeft: 10, flags: 0, isGameOver: false, gameStarted: false, timer: 0, timerInterval: null, fxInterval: null, mode: 'dig', musicVol: 0.5, sfxVol: 0.7, squares: [], activeDifficulty: 10, fxParticles: [] };
        const AUDIO = new (window.AudioContext || window.webkitAudioContext)();
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let musicNodes = [];
        
        // Zoznam súborov na načítanie (ak budú existovať)
        const AUDIO_FILES = {
            bgMusic: new Audio('hudba.mp3'),
            dig: new Audio('klik.mp3'),
            flag: new Audio('vlajka.mp3'),
            boom: new Audio('vybuch.mp3'),
            win: new Audio('vyhra.mp3')
        };
        // Nastavenie slučky pre hudbu
        AUDIO_FILES.bgMusic.loop = true;

        document.addEventListener('DOMContentLoaded', () => { 
            loadSettings(); initPeek(); resizeCanvas(); window.addEventListener('resize', resizeCanvas); startFxLoop();
            
            // Odomknutie audia
            document.body.addEventListener('click', startAudioEngine, { once: true });
            document.body.addEventListener('touchstart', startAudioEngine, { once: true });
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) stopMusic(); else startMusic();
            });
        });

        function startAudioEngine() {
            if (AUDIO.state === 'suspended') AUDIO.resume();
            startMusic();
        }

        /* --- HUDBA (Hybrid: MP3 alebo Synth) --- */
        function startMusic() {
            if (STATE.musicVol <= 0.01) return;
            
            // Skús prehrať MP3
            let promise = AUDIO_FILES.bgMusic.play();
            if (promise !== undefined) {
                promise.catch(error => {
                    // Ak MP3 zlyhá (neexistuje), spusti generátor
                    if (musicNodes.length === 0) startGenerativeMusic();
                });
            }
            AUDIO_FILES.bgMusic.volume = STATE.musicVol * 0.5;
        }

        function stopMusic() {
            AUDIO_FILES.bgMusic.pause();
            stopGenerativeMusic();
        }

        // GENERATÍVNA HUDBA (Fallback) - Zen Ambient
        function startGenerativeMusic() {
            if (musicNodes.length > 0) return;
            const playNote = () => {
                if(STATE.musicVol <= 0) return;
                const osc = AUDIO.createOscillator();
                const gain = AUDIO.createGain();
                const panner = AUDIO.createStereoPanner();
                
                // C Major Pentatonic (Jemné tóny)
                const freqs = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
                osc.type = 'sine';
                osc.frequency.value = freqs[Math.floor(Math.random() * freqs.length)];
                
                gain.gain.setValueAtTime(0, AUDIO.currentTime);
                gain.gain.linearRampToValueAtTime(STATE.musicVol * 0.1, AUDIO.currentTime + 2);
                gain.gain.exponentialRampToValueAtTime(0.001, AUDIO.currentTime + 6);
                
                panner.pan.value = Math.random() * 2 - 1;

                osc.connect(gain); gain.connect(panner); panner.connect(AUDIO.destination);
                osc.start(); osc.stop(AUDIO.currentTime + 6);
            };
            const interval = setInterval(playNote, 4000);
            musicNodes.push({stop: ()=>clearInterval(interval)});
            playNote();
        }

        function stopGenerativeMusic() {
            musicNodes.forEach(n => n.stop());
            musicNodes = [];
        }

        function playSfx(type) {
            if (STATE.sfxVol <= 0.01) return;
            
            // 1. Skús MP3
            const sound = AUDIO_FILES[type];
            if (sound && sound.readyState >= 2) {
                sound.volume = STATE.sfxVol;
                sound.currentTime = 0;
                sound.play().catch(e => playSynthSfx(type));
            } else {
                // 2. Fallback na Synth
                playSynthSfx(type);
            }
        }

        /* --- SYNTH SFX (Záloha) --- */
        function playSynthSfx(type) {
            const t = AUDIO.currentTime;
            if (type === 'dig') {
                const n = AUDIO.createBufferSource(); const b = AUDIO.createBuffer(1, 44100*0.05, 44100); const d = b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; n.buffer=b;
                const g=AUDIO.createGain(); g.gain.setValueAtTime(STATE.sfxVol*0.5,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.05); n.connect(g); g.connect(AUDIO.destination); n.start(t);
            } else if (type === 'flag') {
                let o = AUDIO.createOscillator(); o.frequency.setValueAtTime(600, t); o.frequency.linearRampToValueAtTime(800, t+0.1);
                let g = AUDIO.createGain(); g.gain.setValueAtTime(STATE.sfxVol*0.2, t); g.gain.linearRampToValueAtTime(0, t+0.1);
                o.connect(g); g.connect(AUDIO.destination); o.start(t); o.stop(t+0.1);
            } else if (type === 'boom') {
                let o = AUDIO.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(100, t); o.frequency.exponentialRampToValueAtTime(10, t+1.0);
                let g = AUDIO.createGain(); g.gain.setValueAtTime(STATE.sfxVol, t); g.gain.exponentialRampToValueAtTime(0.01, t+1.0);
                let f = AUDIO.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 400;
                o.connect(f); f.connect(g); g.connect(AUDIO.destination); o.start(t); o.stop(t+1.0);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f,i) => {
                    let o = AUDIO.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
                    let g = AUDIO.createGain(); g.gain.setValueAtTime(0, t+i*0.1); g.gain.linearRampToValueAtTime(STATE.sfxVol*0.2, t+i*0.1+0.05); g.gain.exponentialRampToValueAtTime(0.01, t+i*0.1+0.5);
                    o.connect(g); g.connect(AUDIO.destination); o.start(t+i*0.1); o.stop(t+i*0.1+0.6);
                });
            }
        }

        /* --- ZVYŠOK KÓDU (Logika, Grafika, FX) --- */
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function initPeek() {
            const overlay = document.getElementById('modal-gameover');
            function startPeek(e) { if (e.target === overlay) { e.preventDefault(); overlay.classList.add('peeking'); } }
            function endPeek() { overlay.classList.remove('peeking'); }
            overlay.addEventListener('mousedown', startPeek); overlay.addEventListener('touchstart', startPeek);
            overlay.addEventListener('mouseup', endPeek); overlay.addEventListener('touchend', endPeek); overlay.addEventListener('mouseleave', endPeek);
        }

        class Particle {
            constructor(x, y, type, color) {
                this.x=x; this.y=y; this.type=type; this.color=color;
                this.vx=(Math.random()-0.5)*10; this.vy=(Math.random()-0.5)*10;
                this.alpha=1; this.life=1.0; this.gravity=type==='debris'?0.5:0.05; 
                this.size=type==='debris'?Math.random()*20+10:3;
            }
            update() {
                this.vx*=0.95; this.vy*=0.95; this.vy+=this.gravity;
                this.x+=this.vx; this.y+=this.vy;
                if(this.type==='debris' && (this.x<0||this.x>canvas.width)) this.vx*=-0.7;
                this.life-=0.01; this.alpha=this.life;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x,this.y); ctx.globalAlpha=this.alpha; ctx.fillStyle=this.color;
                if(this.type==='debris') { ctx.fillRect(-this.size/2,-this.size/2,this.size,this.size); }
                else { ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fill(); }
                ctx.restore();
            }
        }
        function startFxLoop() {
            function loop() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                for(let i=STATE.fxParticles.length-1; i>=0; i--) {
                    let p=STATE.fxParticles[i]; p.update(); p.draw(ctx);
                    if(p.life<=0) STATE.fxParticles.splice(i,1);
                }
                requestAnimationFrame(loop);
            }
            loop();
        }
        function spawnFirework() {
            if(STATE.stoppingFireworks) return;
            const x=Math.random()*canvas.width, y=Math.random()*(canvas.height/2);
            for(let i=0;i<60;i++) STATE.fxParticles.push(new Particle(x,y,'firework',`hsl(${Math.random()*360},100%,50%)`));
            playSfx('dig'); // Sound pop
        }
        function triggerPhysicsExplosion(cx, cy) {
            STATE.squares.forEach(sq => {
                if(!sq.checked && !sq.flag && sq.type !== 'bomb') {
                    const r = sq.element.getBoundingClientRect();
                    sq.element.style.visibility = 'hidden';
                    STATE.fxParticles.push(new Particle(r.left+19, r.top+19, 'debris', '#334155'));
                }
            });
        }

        function loadSettings() {
            const s = JSON.parse(localStorage.getItem('miny_settings'));
            if (s) { 
                STATE.musicVol = s.musicVol ?? 0.5; STATE.sfxVol = s.sfxVol ?? 0.7;
                document.getElementById('music-volume').value = STATE.musicVol * 100;
                document.getElementById('sfx-volume').value = STATE.sfxVol * 100;
            }
        }
        function updateVolumes() {
            STATE.musicVol = document.getElementById('music-volume').value / 100;
            STATE.sfxVol = document.getElementById('sfx-volume').value / 100;
            localStorage.setItem('miny_settings', JSON.stringify({ musicVol: STATE.musicVol, sfxVol: STATE.sfxVol }));
            AUDIO_FILES.bgMusic.volume = STATE.musicVol * 0.5;
            if(STATE.musicVol === 0) stopMusic(); else startMusic();
        }

        function toggleDifficulty() { document.getElementById('difficulty-selector').classList.toggle('open'); }
        function switchScreen(name) {
            document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.classList.add('hidden'); });
            const target = document.getElementById(`screen-${name}`); target.classList.remove('hidden'); setTimeout(() => target.classList.add('active'), 10);
            STATE.screen = name;
        }
        function goToMenu() { clearInterval(STATE.timerInterval); STATE.stoppingFireworks=true; clearInterval(STATE.fxInterval); switchScreen('menu'); closeModal('modal-gameover'); }
        function confirmExit() { if(confirm("Návrat do menu?")) goToMenu(); }
        function openSettings() { document.getElementById('modal-settings').classList.add('active'); }
        function openLeaderboard() { document.getElementById('modal-leaderboard').classList.add('active'); renderLeaderboard(STATE.activeDifficulty); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function startNewGame(mines) { STATE.minesTotal = mines; STATE.activeDifficulty = mines; switchScreen('game'); restartGame(); }
        function restartGame() {
            closeModal('modal-gameover'); STATE.stoppingFireworks = false; clearInterval(STATE.fxInterval); STATE.fxParticles = []; 
            clearInterval(STATE.timerInterval); STATE.isGameOver = false; STATE.gameStarted = false; STATE.flags = 0; STATE.seconds = 0; STATE.minesLeft = STATE.minesTotal; STATE.mode = 'dig';
            const btn = document.getElementById('mode-btn'); btn.innerHTML = "⛏️ KOPAŤ"; btn.className = "mode-toggle";
            document.getElementById('grid-container').style.opacity = '1';
            updateUI(); createGrid(); 
        }

        function createGrid() {
            const grid = document.getElementById('grid'); grid.innerHTML = ''; STATE.squares = [];
            for (let i = 0; i < CONFIG.width * CONFIG.height; i++) {
                const el = document.createElement('div'); el.classList.add('cell'); el.dataset.id = i;
                el.addEventListener('mousedown', handleMouseDown); el.addEventListener('mouseup', handleMouseUp); el.addEventListener('mouseleave', cancelLongPress);
                el.addEventListener('touchstart', handleTouchStart, {passive: false}); el.addEventListener('touchend', handleTouchEnd); el.oncontextmenu = (e) => { e.preventDefault(); };
                grid.appendChild(el); STATE.squares.push({ element: el, index: i, type: 'valid', checked: false, flag: false, neighbors: 0 });
            }
        }

        function generateBombs(safeIndex) {
            const totalCells = CONFIG.width * CONFIG.height; const indices = []; const safeZone = [safeIndex, ...getNeighborIndices(safeIndex)];
            for(let i=0; i<totalCells; i++) if(!safeZone.includes(i)) indices.push(i);
            indices.sort(() => Math.random() - 0.5);
            indices.slice(0, STATE.minesTotal).forEach(idx => { STATE.squares[idx].type = 'bomb'; });
            STATE.squares.forEach(sq => { if (sq.type === 'valid') { let count = 0; getNeighborIndices(sq.index).forEach(nIdx => { if (STATE.squares[nIdx].type === 'bomb') count++; }); sq.neighbors = count; } });
            STATE.gameStarted = true; startTimer();
        }

        let pressTimer; let isLongPress = false;
        function handleMouseDown(e) { if (e.button === 2) { handleFlag(parseInt(this.dataset.id)); return; } startPress(parseInt(this.dataset.id)); }
        function handleMouseUp(e) { endPress(parseInt(this.dataset.id)); }
        function handleTouchStart(e) { startPress(parseInt(this.dataset.id)); }
        function handleTouchEnd(e) { e.preventDefault(); endPress(parseInt(this.dataset.id)); }

        function startPress(index) {
            if(STATE.isGameOver || STATE.squares[index].checked) return;
            isLongPress = false; STATE.squares[index].element.style.transform = "scale(0.96)";
            pressTimer = setTimeout(() => { isLongPress = true; if(STATE.sfxVol>0 && navigator.vibrate) navigator.vibrate(50); STATE.squares[index].element.classList.add('long-press-active'); setTimeout(() => { STATE.squares[index].element.classList.remove('long-press-active'); }, 200); handleFlag(index); }, CONFIG.longPressTime);
        }
        function cancelLongPress() { clearTimeout(pressTimer); if(this.dataset && STATE.squares[this.dataset.id]) STATE.squares[this.dataset.id].element.style.transform = "scale(1)"; }
        function endPress(index) { clearTimeout(pressTimer); STATE.squares[index].element.style.transform = "scale(1)"; if (!isLongPress) { if (STATE.mode === 'dig') handleDig(index); else handleFlag(index); } }

        function handleDig(index) {
            if (STATE.isGameOver) { if(document.getElementById('mode-btn').classList.contains('restart-mode')) restartGame(); return; }
            if (STATE.squares[index].flag || STATE.squares[index].checked) return;
            if (!STATE.gameStarted) generateBombs(index);
            
            // Efekt
            const rect = STATE.squares[index].element.getBoundingClientRect();
            STATE.fxParticles.push(new Particle(rect.left+19, rect.top+19, 'debris', '#334155'));
            playSfx('dig');

            if (STATE.squares[index].type === 'bomb') gameOver(false, index);
            else { reveal(index); checkForWin(); }
        }

        function reveal(index) {
            const sq = STATE.squares[index]; if (sq.checked || sq.flag) return;
            sq.checked = true; sq.element.classList.add('checked');
            if (sq.neighbors > 0) {
                sq.element.innerText = sq.neighbors;
                sq.element.classList.add(['zero','one','two','three','four','five'][Math.min(sq.neighbors, 5)]);
            } else {
                const neighbors = getNeighborIndices(index);
                neighbors.sort(() => Math.random() - 0.5);
                neighbors.forEach((nIdx, i) => { setTimeout(() => { if(!STATE.squares[nIdx].checked) { 
                    const r = STATE.squares[nIdx].element.getBoundingClientRect();
                    STATE.fxParticles.push(new Particle(r.left+19, r.top+19, 'debris', '#334155'));
                    playSfx('dig');
                    reveal(nIdx); 
                }}, i * 15); });
            }
        }

        function handleFlag(index) {
            if (STATE.isGameOver || STATE.squares[index].checked) return;
            const sq = STATE.squares[index];
            if (!sq.flag) { if (STATE.flags < STATE.minesTotal) { sq.flag = true; sq.element.classList.add('flag'); sq.element.innerHTML = '🚩'; STATE.flags++; playSfx('flag'); } }
            else { sq.flag = false; sq.element.classList.remove('flag'); sq.element.innerHTML = ''; STATE.flags--; playSfx('flag'); }
            updateUI();
        }

        function getNeighborIndices(index) {
            const neighbors = []; const x = index % CONFIG.width; const y = Math.floor(index / CONFIG.width);
            for (let dx = -1; dx <= 1; dx++) { for (let dy = -1; dy <= 1; dy++) { if (dx === 0 && dy === 0) continue; const nx = x + dx; const ny = y + dy; if (nx >= 0 && nx < CONFIG.width && ny >= 0 && ny < CONFIG.height) neighbors.push(ny * CONFIG.width + nx); } }
            return neighbors;
        }

        function checkForWin() {
            if(STATE.squares.filter(s => s.type === 'valid' && !s.checked).length === 0) { gameOver(true); }
        }

        function gameOver(win, badIndex = -1) {
            STATE.isGameOver = true; clearInterval(STATE.timerInterval);
            if (!win) {
                const sq = STATE.squares[badIndex]; const rect = sq.element.getBoundingClientRect();
                playSfx('boom'); if(STATE.sfxVol>0 && navigator.vibrate) navigator.vibrate([100, 50, 100]);
                STATE.squares.forEach(s => { if (s.type === 'bomb') { s.element.classList.add('checked', 'bomb'); s.element.innerHTML = '💣'; } });
                triggerPhysicsExplosion(rect.left+19, rect.top+19);
                setTimeout(() => showGameOverModal(false), 1500);
            } else {
                STATE.squares.forEach(s => { if (s.type === 'bomb') { s.element.innerHTML = '🚩'; s.element.classList.add('flag'); } });
                playSfx('win'); STATE.fxInterval = setInterval(spawnFirework, 600);
                setTimeout(() => showGameOverModal(true), 1500);
            }
        }

        function showGameOverModal(win) {
            const m = document.getElementById('modal-gameover');
            const title = document.getElementById('go-title'); const msg = document.getElementById('go-msg');
            const winControls = document.getElementById('win-controls'); const lossControls = document.getElementById('loss-controls');
            m.classList.add('active');
            if (win) { title.innerText = "VÍŤAZSTVO!"; title.style.color = "var(--success)"; msg.innerHTML = `Čas: <strong style="color:var(--primary)">${document.getElementById('ui-timer').innerText}</strong>`; winControls.style.display = "block"; lossControls.style.display = "none"; const savedName = localStorage.getItem('miny_player_name'); if (savedName) document.getElementById('player-name').value = savedName; }
            else { title.innerText = "BUM! PREHRA"; title.style.color = "var(--accent)"; msg.innerText = "Nevadí, skús to znova."; winControls.style.display = "none"; lossControls.style.display = "block"; const btn = document.getElementById('mode-btn'); btn.innerHTML = "↻ HRAŤ ZNOVA"; btn.className = "mode-toggle restart-mode"; }
        }

        function handleWinAction(action) {
            const nameInput = document.getElementById('player-name'); const name = nameInput.value.trim() || "Hráč"; localStorage.setItem('miny_player_name', name);
            const key = `miny_scores_${STATE.activeDifficulty}`; let scores = JSON.parse(localStorage.getItem(key)) || [];
            scores.push({ name, time: STATE.seconds, date: new Date().toLocaleDateString() }); scores.sort((a, b) => a.time - b.time); scores = scores.slice(0, 10);
            localStorage.setItem(key, JSON.stringify(scores));
            if (action === 'restart') restartGame(); else goToMenu();
        }

        function toggleMode() {
            if (STATE.isGameOver) { restartGame(); return; }
            const btn = document.getElementById('mode-btn');
            if (STATE.mode === 'dig') { STATE.mode = 'flag'; btn.innerHTML = "🚩 VLAJKA"; btn.classList.add('flag-mode'); }
            else { STATE.mode = 'dig'; btn.innerHTML = "⛏️ KOPAŤ"; btn.classList.remove('flag-mode'); }
            playSfx('flag');
        }

        function updateUI() { document.getElementById('ui-mines').innerText = STATE.minesTotal - STATE.flags; if(!STATE.gameStarted) document.getElementById('ui-timer').innerText = "00:00"; }
        function startTimer() { STATE.seconds = 0; STATE.timerInterval = setInterval(() => { STATE.seconds++; document.getElementById('ui-timer').innerText = formatTime(STATE.seconds); }, 1000); }
        function formatTime(s) { let m = Math.floor(s / 60); let sec = s % 60; return (m<10?"0"+m:m)+":"+(sec<10?"0"+sec:sec); }
        function doVibrate(p) { if (STATE.vibrate && navigator.vibrate) navigator.vibrate(p); }
        function renderLeaderboard(diff) {
            [10, 15, 20, 25].forEach(d => { const btn = document.getElementById(`tab-${d}`); if(d===diff) btn.classList.add('active'); else btn.classList.remove('active'); });
            const scores = JSON.parse(localStorage.getItem(`miny_scores_${diff}`)) || [];
            let html = `<table><tr><th colspan="3" style="text-align:center; color:var(--primary)">${diff} MÍN</th></tr>`;
            if(scores.length===0) html+="<tr><td colspan='3' style='text-align:center'>Žiadne dáta</td></tr>";
            else scores.forEach((s,i) => { html+=`<tr><td>${i+1}.</td><td>${s.name}</td><td style="text-align:right; font-weight:bold">${formatTime(s.time)}</td></tr>`; });
            html+="</table>"; document.getElementById('leaderboard-content').innerHTML = html;
        }
    </script>
</body>
</html>
